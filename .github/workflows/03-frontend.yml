name: 03 · Pruebas del frontend

on:
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/03-frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/03-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: TypeScript + ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: "26.13.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        working-directory: frontend
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      # El build de producción se valida en 01-despliegue y 04-formulario,
      # donde WordPress y el seed están disponibles (generateStaticParams
      # necesita al menos una noticia publicada).
