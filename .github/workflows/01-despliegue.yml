name: 01 · Despliegue de contenedores

on:
  push:
    branches: [main]
    paths:
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - ".env.example"
      - "frontend/**"
      - "scripts/**"
      - "wp_content/**"
      - ".github/workflows/01-despliegue.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: despliegue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desplegar:
    name: Levantar, sembrar y verificar
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar entorno
        uses: ./.github/actions/preparar-entorno

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar Compose
        run: docker compose config > /dev/null

      - name: Levantar MariaDB y WordPress
        run: docker compose up -d db wordpress

      - name: Esperar WordPress
        run: bash scripts/ci/esperar-servicio.sh http://localhost:8080/wp-login.php 90

      - name: Bootstrap e importación
        run: python3 scripts/seed/seed.py bootstrap

      - name: Levantar frontend de producción
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d frontend

      - name: Esperar frontend
        run: bash scripts/ci/esperar-servicio.sh http://localhost:3000 120

      - name: QA del despliegue
        run: bash scripts/ci/qa-frontend.sh http://localhost:3000

      - name: Pruebas de WordPress
        run: bash scripts/ci/probar-wordpress.sh

      - name: Recolectar logs
        if: failure()
        run: |
          docker compose ps > despliegue.log
          docker compose logs --no-color >> despliegue.log

      - name: Publicar resumen
        if: always()
        run: |
          if ls reportes/*.md >/dev/null 2>&1; then
            cat reportes/*.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: despliegue-reportes
          path: |
            reportes/
            despliegue.log
          retention-days: 5
          if-no-files-found: ignore

      - name: Bajar entorno
        if: always()
        run: docker compose down -v --remove-orphans
