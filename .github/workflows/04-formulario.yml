name: 04 · Formulario de admisiones

on:
  push:
    branches: [main, develop]
    paths:
      - "frontend/app/api/**"
      - "frontend/app/componentes/FormularioAdmision.tsx"
      - "frontend/app/lib/solicitudes.ts"
      - "frontend/app/lib/solicitudes-wp.ts"
      - "frontend/app/lib/rate-limit.ts"
      - "scripts/wordpress/mu-plugins/uneti-solicitudes.php"
      - "scripts/ci/probar-formulario.mjs"
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - ".github/workflows/04-formulario.yml"
  pull_request:
    paths:
      - "frontend/app/api/**"
      - "frontend/app/componentes/FormularioAdmision.tsx"
      - "frontend/app/lib/solicitudes.ts"
      - "frontend/app/lib/solicitudes-wp.ts"
      - "frontend/app/lib/rate-limit.ts"
      - "scripts/wordpress/mu-plugins/uneti-solicitudes.php"
      - "scripts/ci/probar-formulario.mjs"
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - ".github/workflows/04-formulario.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formulario-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formulario:
    name: Envío real + persistencia en MariaDB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar entorno
        uses: ./.github/actions/preparar-entorno

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configurar Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: "26.13.0"

      - name: Levantar MariaDB y WordPress
        run: docker compose up -d db wordpress

      - name: Esperar WordPress
        run: bash scripts/ci/esperar-servicio.sh http://localhost:8080/wp-login.php 90

      - name: Bootstrap e importación
        run: python3 scripts/seed/seed.py bootstrap

      - name: Levantar frontend de producción
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d frontend

      - name: Esperar frontend
        run: bash scripts/ci/esperar-servicio.sh http://localhost:3000 120

      - name: Probar el formulario de punta a punta
        run: node scripts/ci/probar-formulario.mjs

      - name: Verificar persistencia del folio
        run: |
          FOLIO="$(cat reportes/folio.txt)"
          if [ -z "$FOLIO" ]; then
            echo "No se generó un folio."
            exit 1
          fi
          docker compose exec -T wordpress php -r '
            require "/var/www/html/wp-load.php";
            $folio = $argv[1];
            $posts = get_posts(
              array(
                "post_type"   => "solicitud_uneti",
                "post_status" => "private",
                "numberposts" => 1,
                "meta_key"    => "_uneti_folio",
                "meta_value"  => $folio,
              )
            );
            if ( ! $posts ) {
              fwrite( STDERR, "No se encontró el folio " . $folio . "\n" );
              exit( 1 );
            }
            echo "OK " . $folio . " / " . get_post_meta( $posts[0]->ID, "_uneti_correo", true ) . "\n";
          ' "$FOLIO"

      - name: Recolectar logs
        if: failure()
        run: |
          docker compose ps > formulario.log
          docker compose logs --no-color >> formulario.log

      - name: Publicar resumen
        if: always()
        run: |
          if ls reportes/*.md >/dev/null 2>&1; then
            cat reportes/*.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formulario-reportes
          path: |
            reportes/
            formulario.log
          retention-days: 5
          if-no-files-found: ignore

      - name: Bajar entorno
        if: always()
        run: docker compose down -v --remove-orphans
