# ==============================================================================
# DEFAULT SERVER — Retorna 404 para peticiones sin coincidencia de dominio
# ==============================================================================
# Cualquier request HTTP que NO coincida con un server_name configurado
# (wp.uneti.local, netx.uneti.local) recibirá un error 404 genérico.
# Esto protege contra escaneos por IP directa y oculta la existencia de servicios.
#
# IMPORTANTE: Este bloque usa la directiva 'default_server' para anular
# el default implícito de NPM. No afecta a los proxy hosts configurados.
# ==============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # Logs de auditoría para intentos no autorizados
    access_log /data/logs/default_404_access.log;
    error_log  /data/logs/default_404_error.log warn;

    # Cabeceras de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'" always;

    # No revelar información del servidor
    server_tokens off;

    # Todas las rutas devuelven 404
    location / {
        return 404;
    }

    # Denegar acceso a archivos ocultos
    location ~ /\. {
        return 404;
    }
}
