# ==============================================================================
# RESTRICCIÓN DE ACCESO: /wp-admin y /wp-login.php
# ==============================================================================
# Este archivo se inyecta automáticamente en CADA server block de proxy host
# de Nginx Proxy Manager. Las reglas de /wp-admin solo aplican al proxy host
# de WordPress (wp.uneti.local). Para Next.js (netx.uneti.local) estas rutas
# no existen, por lo que el bloque no tiene efecto práctico.
#
# EQUIPOS AUTORIZADOS (Tailscale):
#   - enrique         → 100.126.137.66  (canaima-archcraft-ed)
#   - windows         → 100.92.160.7    (servllm-uneti)
#   - ivanCanaima     → 100.115.223.23  (canaima-f1)
#   - ivanMac         → 100.102.14.91   (ivan-mac-1)
#
# ⚠️  NOTA IMPORTANTE — Mac de Ivan:
# La MacBook Pro 2016 de ivan se registra como nueva máquina en Tailscale
# cada vez que se enciende. Esto causa que su IP y hostname cambien
# (ivan-mac-1, ivan-mac-2, etc.). Si ivan no puede acceder a /wp-admin
# desde su Mac, ejecutar:
#
#   tailscale status | grep ivan-mac
#
# Y actualizar la IP en este archivo. Luego recargar nginx:
#
#   docker exec SD-UNETI_npm nginx -s reload
#
# ==============================================================================

# --- Bloquear acceso a /wp-admin (panel de administración) ---
location ^~ /wp-admin {
    # Equipos autorizados (Tailscale)
    allow 100.126.137.66;    # enrique (canaima-archcraft-ed)
    allow 100.92.160.7;      # windows (servllm-uneti)
    allow 100.115.223.23;    # ivanCanaima (canaima-f1)
    allow 100.102.14.91;     # ivanMac (ivan-mac-1) — ACTUALIZAR si cambia IP

    # Red interna Docker (comunicación entre contenedores)
    allow 172.19.0.0/16;

    # Localhost
    allow 127.0.0.1;

    # Denegar todo lo demás
    deny all;

    # Proxy al backend WordPress (reutiliza variables y headers de NPM)
    include conf.d/include/proxy.conf;
}

# --- Bloquear acceso a wp-login.php (formulario de login) ---
location = /wp-login.php {
    # Mismos equipos autorizados
    allow 100.126.137.66;    # enrique (canaima-archcraft-ed)
    allow 100.92.160.7;      # windows (servllm-uneti)
    allow 100.115.223.23;    # ivanCanaima (canaima-f1)
    allow 100.102.14.91;     # ivanMac (ivan-mac-1) — ACTUALIZAR si cambia IP

    # Red interna Docker
    allow 172.19.0.0/16;

    # Localhost
    allow 127.0.0.1;

    # Denegar todo lo demás
    deny all;

    # Proxy al backend WordPress
    include conf.d/include/proxy.conf;
}

# --- Asegurar acceso abierto a la API REST y GraphQL (WordPress Headless) ---
# Estas rutas DEBEN permanecer abiertas para que Next.js (frontend) pueda
# comunicarse con WordPress vía WPGraphQL y la API REST.
#
# Flujo de datos del proyecto:
#   Next.js (SSR) --[GraphQL]--> WordPress --[DB]--> MariaDB
#   Next.js (SSR) --[REST API]--> WordPress/wp-json
#
# No se aplica restricción a /graphql ni /wp-json porque:
#   1. /graphql es necesario para WPGraphQL (consultas del frontend)
#   2. /wp-json es necesario para la API REST de WordPress
#   3. Ambos endpoints ya están protegidos por autenticación de WordPress
#      para operaciones de escritura (POST/PUT/DELETE)
