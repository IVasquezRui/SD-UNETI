services:
  # Base de Datos: MariaDB (versión LTS fijada para reproducibilidad)
  db:
    image: ${MARIADB_IMAGE:-mariadb:11.8.9}
    container_name: ${MARIADB_CONTAINER_NAME:-wp_mariadb}
    restart: always
    command: ["--local-infile=0", "--skip-name-resolve"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress_db}
      MYSQL_USER: ${MYSQL_USER:-wp_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      # Evita crear root@% en instalaciones nuevas.
      MARIADB_ROOT_HOST: localhost
    volumes:
      - ${DB_DATA_DIR:-./db_data}:/var/lib/mysql
      # Endurecimiento aplicado solo en la primera inicialización del volumen.
      - ./scripts/database/endurecer.sql:/docker-entrypoint-initdb.d/zz-uneti-endurecer.sql:ro
      # No se monta database/init.sql: la base se crea desde cero y el
      # contenido se restaura con scripts/seed/seed.py bootstrap.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - frontend_net

  # CMS: WordPress Headless (versión fijada)
  wordpress:
    image: ${WORDPRESS_IMAGE:-wordpress:7.1.4-php8.5-apache}
    container_name: ${WORDPRESS_CONTAINER_NAME:-wp_site}
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WORDPRESS_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:-wp_user}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress_db}
      # Token compartido con Next.js para el endpoint de solicitudes.
      UNETI_FORM_TOKEN: ${UNETI_FORM_TOKEN:-}
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_HOME', '${WORDPRESS_URL:-http://localhost:8080}' );
        define( 'WP_SITEURL', '${WORDPRESS_URL:-http://localhost:8080}' );
        define( 'WP_MEMORY_LIMIT', '512M' );
        define( 'DISALLOW_FILE_EDIT', true );
        define( 'DISABLE_WP_CRON', true );
        define( 'FS_METHOD', 'direct' );
    volumes:
      - ${WP_DATA_DIR:-./wp_data}:/var/www/html
      # Plugin propio para comentarios y scripts operativos del proyecto.
      - ./scripts/wordpress/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      # Endurecimiento de Apache y PHP.
      - ./scripts/wordpress/apache/seguridad.conf:/etc/apache2/conf-enabled/zz-uneti-seguridad.conf:ro
      - ./scripts/wordpress/php/seguridad.ini:/usr/local/etc/php/conf.d/zz-uneti-seguridad.ini:ro
      # WPGraphQL se versiona en el repo para que un clon limpio lo tenga.
      - ./wp_content/plugins/wp-graphql:/var/www/html/wp-content/plugins/wp-graphql:ro
      - ./scripts/wordpress:/opt/uneti-scripts:ro
    networks:
      - frontend_net

  # Frontend Headless: Next.js (App Router) + TypeScript + Tailwind con Node.js 26 LTS
  frontend:
    image: ${NODE_IMAGE:-node:26.13.0-slim}
    container_name: ${FRONTEND_CONTAINER_NAME:-next_frontend}
    restart: always
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      # NODE_ENV no se fija globalmente: next dev lo define como development y
      # next build como production. Un valor fijo rompe el build de producción.
      WATCHPACK_POLLING: "true"
      # URL pública que consume el navegador y usan metadatos/compartir
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
      # URLs públicas que consume el navegador
      NEXT_PUBLIC_WP_URL: ${WORDPRESS_URL:-http://localhost:8080}
      NEXT_PUBLIC_GRAPHQL_URL: ${WORDPRESS_URL:-http://localhost:8080}/graphql
      # Token servidor-a-servidor para el endpoint de solicitudes.
      WP_FORM_TOKEN: ${UNETI_FORM_TOKEN:-}
      # URL interna (resolución por DNS de Docker dentro de frontend_net)
      WP_INTERNAL_URL: http://wordpress
      WP_GRAPHQL_URL: http://wordpress/graphql
    volumes:
      - ./frontend:/app
      # node_modules vive dentro del contenedor: evita binarios linux en el host
      - /app/node_modules
    depends_on:
      wordpress:
        condition: service_started
    networks:
      - frontend_net

networks:
  frontend_net:
    name: ${NETWORK_NAME:-frontend_net}
    driver: bridge