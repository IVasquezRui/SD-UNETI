networks:
  uneti_network:
    name: uneti_network
    driver: bridge

services:
  # 1. PROXY INVERSO: Nginx Proxy Manager (NPM)
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: SD-UNETI_npm
    restart: unless-stopped
    ports:
      - "80:80"     # Puerto HTTP público
      - "443:443"   # Puerto HTTPS público
      - "81:81"     # Puerto del panel de administración web
    environment:
      # NPM por defecto usa una base de datos SQLite embebida, la cual persistimos abajo en los volúmenes.
      DB_SQLITE_FILE: "/data/database.sqlite"
    volumes:
      - ./npm/data:/data
      - ./npm/letsencrypt:/etc/letsencrypt
      - ./proxy:/data/nginx/custom    # Configs custom de Nginx (404 default + wp-admin ACL)
    networks:
      - uneti_network

  # 2. BASE DE DATOS: MariaDB
  db:
    image: mariadb:10.11
    container_name: SD-UNETI_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./db:/var/lib/mysql
    networks:
      - uneti_network
    # NOTA: Sin puertos expuestos al host por seguridad (accesible solo internamente por uneti_network)

  # 3. BACKEND (Headless): WordPress oficial
  wordpress:
    depends_on:
      - db
    image: wordpress:latest
    container_name: SD-UNETI_WPHbackend
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      # Límites de memoria recomendados para producción
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_MEMORY_LIMIT', '256M' );
        define( 'WP_MAX_MEMORY_LIMIT', '512M' );
    volumes:
      - ./wordpress:/var/www/html
    networks:
      - uneti_network
    # NOTA: Tampoco exponemos puerto al host. Nginx Proxy Manager ruteará el tráfico al puerto 80 interno de este contenedor.

  # 4. FRONTEND: Next.js (Node.js)
  frontend:
    image: node:20-alpine
    container_name: SD-UNETI_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
    # Ejecuta el proyecto si existe; si no, mantiene el contenedor vivo para desarrollo
    command: sh -c "if [ -f package.json ]; then npm install && npm run dev; else tail -f /dev/null; fi"
    environment:
      - NEXT_PUBLIC_WORDPRESS_API_URL=${NEXT_PUBLIC_WORDPRESS_API_URL:-http://wordpress/wp-json}
      - NEXT_PUBLIC_WORDPRESS_GRAPHQL_URL=${NEXT_PUBLIC_WORDPRESS_GRAPHQL_URL:-http://wp.uneti.local/graphql}
      - WORDPRESS_GRAPHQL_URL=${WORDPRESS_GRAPHQL_URL:-http://wordpress/graphql}
    networks:
      - uneti_network
    # NOTA: Nginx Proxy Manager ruteará el tráfico al puerto 3000 interno de este contenedor.