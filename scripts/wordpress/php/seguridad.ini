; Endurecimiento de PHP para el contenedor WordPress.
; Controles alineados con ISO/IEC 27001 (A.8.9) y SOC 2 (CC6).
expose_php = Off
display_errors = Off
log_errors = On
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.use_only_cookies = 1
allow_url_include = Off
upload_max_filesize = 8M
post_max_size = 8M
max_execution_time = 60
; session.cookie_secure se activa en el despliegue con HTTPS (ver Documents/seguridad).

