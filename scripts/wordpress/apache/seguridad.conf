ServerSignature Off

<Directory /var/www/html>
  Options -Indexes
</Directory>

<FilesMatch "^(readme\.html|license\.txt|wp-config\.php\.(bak|old|save|swp)|\.env|xmlrpc\.php)$">
  Require all denied
</FilesMatch>

<LocationMatch "^/\.(env|git)">
  Require all denied
</LocationMatch>

<LocationMatch "^/wp-content/uploads/.*\.(php|phtml|phar)$">
  Require all denied
</LocationMatch>
