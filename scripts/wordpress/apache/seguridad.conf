# Endurecimiento de Apache para el WordPress headless de la UNETI.
# Controles alineados con ISO/IEC 27001 (A.8.9, A.8.20) y SOC 2 (CC6/CC7).
ServerSignature Off
ServerTokens Prod
TraceEnable Off

# 10 MB es suficiente para el panel y los medios del portal.
LimitRequestBody 10485760

<Directory /var/www/html>
  Options -Indexes
  AllowOverride All
</Directory>

<FilesMatch "^(readme\.html|license\.txt|wp-config\.php\.(bak|old|save|swp)|\.env|xmlrpc\.php)$">
  Require all denied
</FilesMatch>

# Respaldos, volcados y comprimidos que nunca deben servirse.
<FilesMatch ".*\.(bak|old|save|swp|sql|log|zip|tar|gz|tgz|ini|sh)$">
  Require all denied
</FilesMatch>

<LocationMatch "^/\.(env|git|svn|hg)">
  Require all denied
</LocationMatch>

<LocationMatch "^/wp-content/uploads/.*\.(php|phtml|phar)$">
  Require all denied
</LocationMatch>

<LocationMatch "^/wp-content/mu-plugins(/|$)">
  Require all denied
</LocationMatch>

<IfModule mod_headers.c>
  Header always set X-Content-Type-Options "nosniff"
  Header always set X-Frame-Options "SAMEORIGIN"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
  Header always set X-Permitted-Cross-Domain-Policies "none"
  Header unset X-Pingback
</IfModule>

